<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识图谱三元组可视化</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="triples-panel">
        <header class="panel-head">
          <div>
            <p class="eyebrow" data-i18n="kgTriples">三元组</p>
            <h1 data-i18n="appTitle">知识图谱</h1>
          </div>
          <div class="stats" id="stats"></div>
          <button class="icon-button" id="leftPanelToggle" type="button" title="折叠左侧栏" data-i18n-title="collapseLeft">-</button>
        </header>

        <section class="subject-info" aria-label="学科基本信息" data-i18n-aria-label="subjectInfo">
          <div class="subject-info-card">
            <div class="subject-info-row"><span data-i18n="grade">年级</span><strong data-i18n="gradeValue">未指定</strong></div>
            <div class="subject-info-row"><span data-i18n="subject">学科</span><strong data-i18n="subjectValue">未指定</strong></div>
            <div class="subject-info-row"><span data-i18n="textbook">教材</span><strong data-i18n="textbookValue">未指定</strong></div>
            <div class="subject-info-row"><span data-i18n="textbookVersion">教材版本</span><strong data-i18n="textbookVersionValue">未指定</strong></div>
          </div>
        </section>

        <section class="filters">
          <label class="search-box" for="searchInput">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="搜索章节、知识点、证据" data-i18n-placeholder="searchPlaceholder" />
          </label>
          <div class="filter-row">
            <select id="predicateFilter" aria-label="关系筛选" data-i18n-aria-label="relationFilter">
              <option value="all">全部关系</option>
            </select>
            <button id="clearFocusButton" class="icon-button" type="button" title="清除聚焦" data-i18n-title="clearFocus">x</button>
          </div>
          <div class="focus-chip" id="focusChip" hidden></div>
        </section>

        <section class="triple-list" id="tripleList" aria-label="三元组列表" data-i18n-aria-label="tripleList"></section>
      </aside>

      <main class="graph-panel">
        <div class="graph-stage">
          <div class="graph-topbar">
            <div class="legend" id="legend"></div>
            <div class="toolbar" aria-label="图谱控制" data-i18n-aria-label="graphControls">
              <button class="icon-button" id="zoomOutButton" type="button" title="缩小" data-i18n-title="zoomOut">-</button>
              <button class="icon-button" id="zoomInButton" type="button" title="放大" data-i18n-title="zoomIn">+</button>
              <button class="icon-button" id="rotateLeftButton" type="button" title="逆时针旋转" data-i18n-title="rotateLeft">↶</button>
              <button class="icon-button" id="rotateRightButton" type="button" title="顺时针旋转" data-i18n-title="rotateRight">↷</button>
              <button class="text-button" id="resetButton" type="button" data-i18n="reset">重置</button>
              <button class="icon-button" id="detailToggle" type="button" title="折叠详情栏" data-i18n-title="collapseDetail">⌄</button>
            </div>
          </div>

          <section class="canvas-wrap">
            <canvas id="graphCanvas"></canvas>
            <div class="hover-card" id="hoverCard" hidden></div>
          </section>

          <div class="detail-resizer" id="detailResizer" role="separator" aria-label="调整详情面板高度" data-i18n-aria-label="resizeDetail" aria-orientation="horizontal"></div>
          <section class="detail-panel" id="detailPanel"></section>
        </div>

        <div id="minimapOverlayBackdrop" aria-hidden="true" hidden></div>
        <aside class="explorer-panel" id="explorerPanel" aria-label="图谱全局缩略导航图" data-i18n-aria-label="minimapPanel">
          <header class="explorer-head">
            <div class="explorer-title">
              <p class="eyebrow">导航</p>
              <h2 data-i18n="minimapTitle">全局缩略导航图</h2>
            </div>
            <div class="explorer-actions">
              <button class="icon-button" id="minimapExpandButton" type="button" aria-expanded="false" title="放大缩略图" data-i18n-title="expandMinimap">⛶</button>
              <button class="icon-button" id="explorerToggle" type="button" title="折叠面板" data-i18n-title="collapsePanel">-</button>
            </div>
          </header>
          <div class="explorer-body">
            <label class="search-box" for="minimapSearchInput">
              <span>⌕</span>
              <input id="minimapSearchInput" type="search" placeholder="检索并高亮节点" data-i18n-placeholder="minimapSearchPlaceholder" />
            </label>
            <div class="minimap-legend" id="minimapLegend"></div>
            <div class="minimap-view" id="explorerMapView">
              <div class="minimap-canvas-wrap" id="minimapCanvasWrap">
                <canvas id="minimapCanvas"></canvas>
              </div>
              <p data-i18n="minimapHint">拖动缩略图背景可平移主图谱；悬停节点可查看直接相邻关系；点击节点可居中并选中。</p>
            </div>
          </div>
          <div data-minimap-resize="n" aria-hidden="true"></div>
          <div data-minimap-resize="ne" aria-hidden="true"></div>
          <div data-minimap-resize="e" aria-hidden="true"></div>
          <div data-minimap-resize="se" aria-hidden="true"></div>
          <div data-minimap-resize="s" aria-hidden="true"></div>
          <div data-minimap-resize="sw" aria-hidden="true"></div>
          <div data-minimap-resize="w" aria-hidden="true"></div>
          <div data-minimap-resize="nw" aria-hidden="true"></div>
        </aside>
      </main>
    </div>

    <div class="image-modal" id="imageModal" hidden>
      <div class="image-modal-backdrop" data-modal-close></div>
      <section class="image-modal-dialog" role="dialog" aria-modal="true" aria-label="图片详情" data-i18n-aria-label="imageDetail">
        <button class="icon-button image-modal-close" id="imageModalClose" type="button" title="关闭" data-i18n-title="close">x</button>
        <div class="image-modal-media">
          <img id="imageModalImg" alt="" />
        </div>
        <aside class="image-modal-info">
          <p class="eyebrow" data-i18n="figurePreview">图片预览</p>
          <h2 id="imageModalTitle"></h2>
          <p id="imageModalDescription"></p>
          <div class="kv" id="imageModalMeta"></div>
        </aside>
      </section>
    </div>

    <script src="./minimap-helpers.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
